  /* =========================================================
     결과 기록 — 하트 5개 이상으로 결과 이미지를 저장하면 코어 코드와 하트한 디자인 코드를
     구글 Apps Script 웹앱(SETTINGS.logEndpoint)으로 1회 전송한다. (통계 분석용)
     · 같은 찜 구성은 다시 보내지 않는다(localStorage 서명). 전송 실패 시 다음 방문에 재시도.
     · 주소가 비어 있으면 아무 것도 하지 않는다. 화면 동작에는 영향을 주지 않는다.
     ========================================================= */
  let lastLogSig = "", lastLogAt = 0;
  function getSessionId(){
    try{
      let sid = localStorage.getItem("prism_sid");
      if(!sid){ sid = "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem("prism_sid", sid); }
      return sid;
    }catch(e){ return "s"+Date.now().toString(36); }
  }
  function isAdminSession(){ try{ return sessionStorage.getItem("prism_admin_authed")==="1"; }catch(e){ return false; } }
  // 결과 이미지 저장이 성공한 시점에 1회 기록한다. (관리자 로그인 상태의 테스트 저장은 기록하지 않는다)
  function logResultSaved(){
    try{
      const url = String((SETTINGS && SETTINGS.logEndpoint) || "").trim();
      if(!url) return;
      const adminTest = isAdminSession();
      if(adminTest && SETTINGS && SETTINGS.logAdmin === false) return;
      const likedIds = getLikedIds();
      if(likedIds.length < LIKE_GOAL) return;
      const likedPosts = sortByDateDesc(POSTS.filter(p=>likedIds.indexOf(p.id)>-1));
      const sig = likedPosts.map(p=>p.id).sort().join(",");
      if(sig===lastLogSig && Date.now()-lastLogAt < 60000) return;   // 같은 구성의 연속 저장(중복 클릭)은 한 번만
      lastLogSig = sig; lastLogAt = Date.now();
      const rt = resultTypeFromTally(computeTally(likedPosts));
      const payload = {
        type:"prism_result",
        sessionId:getSessionId(),
        sentAt:new Date().toISOString(),
        version:APP_VERSION,
        device:(window.innerWidth<720 ? "mobile" : "desktop") + (adminTest ? "·관리자" : ""),
        core:(rt.mbciCode||rt.code),
        codes:likedPosts.map(function(p){ return p.code || p.id; })
      };
      /* 본문이 비어 도착하는 문제(Safari/리다이렉트)를 피하려고 주소(?payload=)에 실어 보낸다. */
      const q = url + (url.indexOf("?")<0 ? "?" : "&") + "payload=" + encodeURIComponent(JSON.stringify(payload));
      fetch(q, { method:"GET", mode:"no-cors", keepalive:true }).catch(function(){
        try{ const im = new Image(); im.src = q; }catch(e2){}
      });
    }catch(e){}
  }
  /* 좋아요 탭에 들어온 시점의 찜 목록(스냅샷). 이 탭 안에서 하트를 해제해도 카드가 바로 사라지지 않고
     흐리게 남아 다시 누를 수 있게 하고, 진행 바/결과는 실제 찜 개수 기준으로 즉시 갱신한다. */
  let likedViewSnapshot = null;
  const SW_SELECTORS = [".type-hero-code",".type-hero h2",".type-hero-tags",".type-hero-desc",".type-hero .fit-tags",".type-hero .rec-studios",".type-hero .badge",".liked-progress .progress-msg",".liked-progress .progress-top span"];
  function refreshLikedView(postId, isAdding){
    if(!likedViewSnapshot) return;
    if(isAdding && likedViewSnapshot.indexOf(postId)<0) likedViewSnapshot.push(postId);
    const app = document.getElementById("app"); if(!app) return;
    const y = window.scrollY;
    const oldFill = app.querySelector(".progress-fill");
    const oldPct = oldFill ? (parseFloat(oldFill.style.width)||0) : null;
    const prevTop = app.querySelector(".type-hero, .liked-progress");
    const prevMode = prevTop ? (prevTop.classList.contains("type-hero") ? "result" : "progress") : null;
    const prevSig = {};
    SW_SELECTORS.forEach(function(sel){ const el = app.querySelector(sel); if(el) prevSig[sel] = el.textContent; });
    const galleryEl = app.querySelector(".liked-view");
    const gy0 = galleryEl ? galleryEl.getBoundingClientRect().top : null;
    // 이전 상단 블록은 복제본으로 남겨 부드럽게 사라지게 한다
    let ghost = null;
    if(prevTop && !REDUCED && prevTop.animate){
      const r = prevTop.getBoundingClientRect();
      ghost = prevTop.cloneNode(true);
      ghost.classList.add("ghost-out");
      ghost.style.left = (r.left + window.scrollX) + "px"; ghost.style.top = (r.top + window.scrollY) + "px"; ghost.style.width = r.width + "px";
    }
    app.classList.remove("page-enter");
    app.innerHTML = renderLiked() + siteFooterHTML();
    window.scrollTo(0, y);
    const newTop = app.querySelector(".type-hero, .liked-progress");
    const mode = newTop ? (newTop.classList.contains("type-hero") ? "result" : "progress") : null;
    const fill = app.querySelector(".progress-fill");
    if(fill){
      const target = fill.style.width;
      fill.style.width = (oldPct!==null ? oldPct : 100) + "%";
      void fill.offsetWidth;
      fill.style.width = target;
    }
    const box = app.querySelector(".liked-progress");
    if(box){ box.classList.add("bump"); }
    if(newTop && prevMode && mode !== prevMode && !REDUCED){
      newTop.classList.add("mode-in");                       // 진행바 ↔ 결과 전환
      if(ghost){
        document.body.appendChild(ghost);
        const g = ghost.animate([{opacity:1, transform:"none"},{opacity:0, transform:"translateY(-10px) scale(.985)"}], {duration:260, easing:"ease-in", fill:"forwards"});
        g.onfinish = function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); };
      }
    } else if(mode==="result" && prevMode==="result" && !REDUCED){
      SW_SELECTORS.forEach(function(sel){                    // 결과 안의 값이 바뀌면 해당 부분만 부드럽게 교체
        const el = app.querySelector(sel);
        if(el && prevSig[sel] !== undefined && prevSig[sel] !== el.textContent) el.classList.add("sw-in");
      });
    }
    const ge = app.querySelector(".liked-view");               // 아래 갤러리가 튀지 않고 미끄러지듯 이동
    if(ge && gy0 !== null && !REDUCED && ge.animate){
      const d = gy0 - ge.getBoundingClientRect().top;
      if(Math.abs(d) > 2) ge.animate([{transform:"translateY("+d+"px)"},{transform:"none"}], {duration:460, easing:"cubic-bezier(.2,.8,.2,1)"});
    }
  }
  function renderLiked(){

    const shownPosts = sortByDateDesc(POSTS.filter(p=>shownIds.indexOf(p.id)>-1));
    const goal = LIKE_GOAL;
    const pct = Math.min(100, Math.round(likedIds.length/goal*100));
    let topBlock;
    if(likedIds.length===0){
      topBlock = '<div class="liked-progress state-0">'
        + '<div class="progress-top"><strong>취향 분석</strong><span>0 / '+goal+'</span></div>'

  function modalSourceRect(postId){
    const tiles = document.querySelectorAll('[data-open-post="'+postId+'"]');
    for(let i=0;i<tiles.length;i++){
      const r = tiles[i].getBoundingClientRect();
      if(r.width>10 && r.bottom>0 && r.top<window.innerHeight && r.right>0 && r.left<window.innerWidth) return r;
    }

  }
  const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function openPostModal(postId){
    currentModalPostId=postId; modalIndex=0; renderModal(postId,0);
    const ov = document.getElementById("modal-overlay"), box = document.getElementById("modal-content");
    const src = REDUCED ? null : modalSourceRect(postId);
    ov.classList.add("open");
    if(!src || !box.animate) return;
    // 사진 앱처럼: 눌린 이미지 자리에서 시작해 팝업 크기로 커지고, 아래 정보는 디졸브로 나타난다.
    const dst = box.getBoundingClientRect();
    const media = box.querySelector(".modal-media");
    const mh = media ? media.offsetHeight : dst.width;
    const sc = src.width / dst.width;
    const dx = src.left - dst.left, dy = src.top - dst.top;
    box.style.transformOrigin = "0 0";
    box.animate([
      {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")", clipPath:"inset(0 0 "+(dst.height-mh)+"px 0 round 8px)"},
      {transform:"none", clipPath:"inset(0 0 0 0 round 20px)"}
    ], {duration:460, easing:"cubic-bezier(.2,.8,.2,1)"});

    if(body) body.animate([{opacity:0},{opacity:0,offset:.35},{opacity:1}], {duration:520, easing:"ease-out"});
    const cl = box.querySelector(".modal-close");
    if(cl) cl.animate([{opacity:0},{opacity:0,offset:.5},{opacity:1}], {duration:460});

  }

    if(!src || !box.animate || !ov.classList.contains("open")){ closeModal(); return; }
    const dst = box.getBoundingClientRect();
    const media = box.querySelector(".modal-media");
    const mh = media ? media.offsetHeight : dst.width;
    const sc = src.width / dst.width;
    box.style.transformOrigin = "0 0";
    currentModalPostId = null;

      {transform:"none", clipPath:"inset(0 0 0 0 round 20px)"},
      {transform:"translate("+(src.left-dst.left)+"px,"+(src.top-dst.top)+"px) scale("+sc+")", clipPath:"inset(0 0 "+(dst.height-mh)+"px 0 round 8px)"}
    ], {duration:300, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});

  /* =========================================================
     7-1. 관리자 비밀번호 해시 (MBCI admin.js의 PBKDF2 패턴 참조)
     평문 비밀번호를 SETTINGS에 두지 않고, salt+해시만 저장/내보내기한다.
     ========================================================= */
  function hasWebCrypto(){
    return typeof crypto !== "undefined" && crypto.subtle && typeof crypto.subtle.deriveBits === "function" && typeof crypto.getRandomValues === "function";
  }
  function bytesToB64(bytes){
    let bin = "";
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToBytes(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function randomSaltB64(){
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return bytesToB64(bytes);
  }
  function pwHash(pw, saltB64, iter){
    if(!hasWebCrypto()) return Promise.resolve(null);
    const enc = new TextEncoder();
    const saltBytes = b64ToBytes(saltB64);
    return crypto.subtle.importKey("raw", enc.encode(pw), {name:"PBKDF2"}, false, ["deriveBits"])
      .then(function(keyMaterial){
        return crypto.subtle.deriveBits({name:"PBKDF2", salt:saltBytes, iterations:iter||100000, hash:"SHA-256"}, keyMaterial, 256);
      })
      .then(function(bits){ return bytesToB64(new Uint8Array(bits)); });
  }
  function checkAdminPw(pw){
    const rec = SETTINGS.adminAuth;
    if(rec && rec.salt && rec.hash && hasWebCrypto()){
      return pwHash(pw, rec.salt, rec.iter||100000).then(function(h){ return h !== null && h === rec.hash; });
    }
    // 구버전 평문 비밀번호가 남아있거나, 이 브라우저에 Web Crypto가 없을 때의 호환 경로
    const legacy = SETTINGS.adminPassword || (rec ? null : "prism2026");
    return Promise.resolve(legacy != null && pw === legacy);
  }
  function exportSafeSettings(){
    // 내보내기(HTML 저장/웹 업로드용 zip) 직전, 평문 비밀번호가 남아있다면 제거해서
    // 공개 배포물(깃허브 페이지)에 비밀번호 평문이 절대 노출되지 않도록 한다.
    const out = clone(SETTINGS||{});
    delete out.adminPassword;
    return out;
  }
  function setAdminPassword(pw){
    if(!hasWebCrypto()){
      // 해시를 못 만드는 환경이면 평문으로라도 저장(이전 동작과 동일하게 유지)
      SETTINGS.adminPassword = pw;
      return Promise.resolve();
    }
    const salt = randomSaltB64();
    return pwHash(pw, salt, 100000).then(function(hash){
      SETTINGS.adminAuth = {salt:salt, hash:hash, iter:100000};
      delete SETTINGS.adminPassword;
    });
  }

  let codeFilter = "", catalogTimer = null, catalogStatus = "";
  function catalogPayload(){
    ensureCodes();
    const pub = (SETTINGS.publicUrl||"").trim().replace(/index\.html$/,"").replace(/\/?$/,"/");
    return {
      type:"prism_catalog", sentAt:new Date().toISOString(), version:APP_VERSION,
      designs:POSTS.map(function(p){
        const st = getStudio(p.studioId) || {name:"", code:""};

  function postToSheet(payload){
    const url = String(SETTINGS.logEndpoint||"").trim();
    const q = url + (url.indexOf("?")<0 ? "?" : "&") + "payload=" + encodeURIComponent(JSON.stringify(payload));
    // 주소(?payload=)로 보내 응답을 읽고, 막혀 있으면 no-cors로 보내되 확인 불가로 표시한다.
    return fetch(q).then(function(r){ return r.json(); }).then(function(j){ return {ok:!!(j && j.ok), data:j, readable:true}; })
      .catch(function(){
        return fetch(q, {mode:"no-cors"}).then(function(){ return {ok:null, readable:false}; }).catch(function(){ return {ok:false, readable:false, net:true}; });
      });
  }
  function sendCatalog(force){
    const url = String(SETTINGS.logEndpoint||"").trim();
    if(!url){ catalogStatus = "구글 시트 웹앱 주소가 비어 있어요. 기본 탭에서 먼저 입력해주세요."; return Promise.resolve(false); }
    const body = catalogPayload();
    const sig = JSON.stringify(body).replace(/"sentAt":"[^"]*",/,"");
    let last = ""; try{ last = localStorage.getItem("prism_catalog_sig")||""; }catch(e){}
    if(!force && last===sig) return Promise.resolve(true);
    const CH = 12, chunks = [];
    for(let i=0;i<body.designs.length;i+=CH) chunks.push(body.designs.slice(i,i+CH));
    const keep = body.designs.map(function(d){ return d.code; });
    let chain = Promise.resolve({ok:true, data:{count:0}, readable:true}), done = 0;
    chunks.forEach(function(ch, idx){
      chain = chain.then(function(prev){
        if(prev.ok !== true) return prev;
        const part = {type:"prism_catalog", sentAt:body.sentAt, version:body.version, designs:ch, partial:true};
        if(idx === chunks.length-1) part.keep = keep;
        return postToSheet(part).then(function(r){ done += ch.length; if(r.data) r.data.count = done; return r; });
      });
    });
    return chain.then(function(r){
      if(r.ok === true){
        try{ localStorage.setItem("prism_catalog_sig", sig); localStorage.setItem("prism_catalog_at", new Date().toLocaleString("ko-KR")); }catch(e){}
        catalogStatus = "시트에 반영됐어요 ("+new Date().toLocaleTimeString("ko-KR")+") · 이미지 "+((r.data&&r.data.count)||body.designs.length)+"개. 시트의 '하트목록' 탭에서 확인하세요.";
        return true;
      }
      if(r.ok === null){
        catalogStatus = "보내긴 했지만 시트의 응답을 확인할 수 없어요. 기본 탭의 '연결 테스트'로 배포 설정을 점검해주세요.";
        return false;
      }
      if(r.readable && r.data && r.data.error){ catalogStatus = "시트가 오류를 돌려줬어요: "+r.data.error+" (구버전 스크립트일 수 있어요. 새 gs로 교체 후 새 버전으로 배포해주세요)"; return false; }
      catalogStatus = "보내지 못했어요. 인터넷 연결과 웹앱 주소를 확인해주세요.";
      return false;
    });
  }
  function testSheetConnection(){
    const url = String(SETTINGS.logEndpoint||"").trim();
    if(!url) return Promise.resolve("웹앱 주소가 비어 있어요.");
    return postToSheet({type:"ping"}).then(function(r){
      if(r.net) return "연결할 수 없어요. 인터넷 연결과 주소(…/exec)를 확인해주세요.";
      if(!r.readable) return "주소에는 닿았지만 응답을 읽을 수 없어요. 배포 설정에서 '액세스 권한: 모든 사용자'인지, '다음 사용자 인증으로 실행: 나'인지 확인하고 새 버전으로 배포해주세요.";
      const d = r.data || {};
      if(d.ok && d.gs) return "정상 연결됐어요 ✓ (스크립트 v"+d.gs+")\n현재 기록: 결과 "+(d.results||0)+"건 · 하트목록 이미지 "+(d.hearts||0)+"개"+(d.gs < 6 ? "\n※ 스크립트가 구버전이에요. 새 gs로 교체 후 새 버전으로 배포해주세요." : "")+(d.url ? "\n"+d.url : "");
      if(d.error === "bad payload") return "연결은 되지만 구버전 스크립트예요. 새 gs로 교체한 뒤 '배포 관리 > 수정 > 새 버전'으로 배포해주세요.";
      return "스크립트 응답: "+(d.error || JSON.stringify(d));
    });
  }

  function bulkUploadToStudio(studioId, fileList){
    const files = Array.from(fileList||[]);
    if(!files.length) return;
    const limit = SETTINGS.studioImageLimit || 20;
    const already = postsByStudio(studioId).length;
    const room = Math.max(0, limit - already);
    if(room <= 0){
      alert("이 스튜디오는 이미 제한("+limit+"개)에 도달했어요. 설정 탭에서 제한을 늘리거나 기존 게시물을 정리해주세요.");
      return;
    }
    const toProcess = files.slice(0, room);
    const skipped = files.length - toProcess.length;
    beginImageOp();
    const results = [];
    sheetBulkProgress = {done:0, total:toProcess.length};
    updateSheetProgressUI();
    function processNext(i){
      if(i >= toProcess.length){
        POSTS.push.apply(POSTS, results);
        saveData();
        endImageOp();
        sheetBulkProgress = null;
        refreshAdminBody();
        if(skipped > 0) alert("스튜디오 제한("+limit+"개)을 넘어서는 "+skipped+"장은 올리지 않았어요. 나머지 "+results.length+"장은 새 게시물로 추가됐습니다.");
        return;
      }
      const file = toProcess[i];
      const reader = new FileReader();
      reader.onload = function(){
        compressImageDataUrl(reader.result, MAX_IMAGE_DIM, MAX_IMAGE_BYTES).then(function(dataUrl){
          const baseName = (file.name||"제목 없음").replace(/\.[^.]+$/,"");
          results.push({id:"p"+Date.now()+"-"+Math.random().toString(36).slice(2,7), studioId:studioId, name:baseName, description:"", styleType:"", industryTags:[], images:[dataUrl], createdAt:new Date().toISOString().slice(0,10)});

  function optimizeAllImages(){
    const before = totalImageBytes();
    const jobs = [];
    STUDIOS.forEach(function(s){
      if(isDataUrl(s.profileImage)){
        jobs.push(compressImageDataUrl(s.profileImage, MAX_IMAGE_DIM, MAX_IMAGE_BYTES, true).then(function(out){ s.profileImage = out; }));
      }
    });
    POSTS.forEach(function(p){
      (p.images||[]).forEach(function(im, idx){
        if(!isDataUrl(im)) return;
        jobs.push(compressImageDataUrl(im, MAX_IMAGE_DIM, MAX_IMAGE_BYTES, true).then(function(out){ p.images[idx] = out; }));
      });
    });
    if(!jobs.length){ alert("최적화할 이미지가 없어요. (이미 이미지 폴더로 분리된 이미지는 대상에서 제외돼요)"); return; }
    beginImageOp();
    Promise.all(jobs).then(function(){
      const after = totalImageBytes();
      saveData();
      endImageOp();
      refreshAdminBody();
      const saved = before - after;
      alert("이미지 최적화 완료.\n\n이전: "+formatBytes(before)+"\n이후: "+formatBytes(after)+"\n절감: "+formatBytes(saved > 0 ? saved : 0)+"\n\n'새 버전으로 저장'을 눌러 HTML 파일로 보관해주세요.");
    }).catch(function(){
      endImageOp();
      alert("최적화 중 문제가 발생했어요. 다시 시도해주세요.");
    });
  }

  function handleAdminFieldChange(el){
    const entity = el.dataset.entity, id = el.dataset.id, field = el.dataset.field;
    const arr = entity==="studio" ? STUDIOS : POSTS;
    const obj = arr.find(o=>o.id===id);
    if(!obj) return;

    if(el.type==="file"){
      const files = Array.from(el.files||[]);
      if(!files.length) return;
      beginImageOp();
      readAndCompressFiles(files).then(function(results){
        if(field==="profileImage") obj.profileImage = results[0];
        saveData();
        refreshAdminBody();
        endImageOp();
      });
      return;
    }
    if(field==="industryTag"){
      const tag = el.dataset.tag; obj.industryTags = obj.industryTags||[];
      const i = obj.industryTags.indexOf(tag);
      if(el.checked && i<0) obj.industryTags.push(tag);
      if(!el.checked && i>-1) obj.industryTags.splice(i,1);
    } else {
      obj[field] = el.value;
    }
    saveData();
    if(entity==="studio" && adminEditingStudioId===id){ refreshAdminBody(); }
  }
  function handleAdminAction(el){
    const action = el.dataset.adminAction;
    if(action==="new-studio"){
      const st = {id:"s"+Date.now(), name:"새 스튜디오", bio:"", tags:[], profileImage:null, avatarColor:null};
      STUDIOS.push(st);
      adminNewStudioId = st.id;
      adminEditingStudioId = st.id;
      saveData(); refreshAdminBody();
    } else if(action==="edit-studio"){
      adminEditingStudioId = el.dataset.id; refreshAdminBody();
    } else if(action==="back-to-studios"){
      cancelUntouchedNewStudio();
      adminEditingStudioId = null; refreshAdminBody();
    } else if(action==="delete-studio"){
      if(!confirm("이 스튜디오와 소속 게시물을 모두 삭제할까요? 되돌릴 수 없어요.")) return;
      STUDIOS = STUDIOS.filter(s=>s.id!==el.dataset.id);
      POSTS = POSTS.filter(p=>p.studioId!==el.dataset.id);
      adminEditingStudioId = null;
      saveData(); refreshAdminBody();
    } else if(action==="toggle-hide-studio"){
      const st = getStudio(el.dataset.id);
      if(st){ st.hidden = !st.hidden; saveData(); refreshAdminBody(); }
    } else if(action==="toggle-studio-tag-section"){
      SETTINGS.studioTagSectionEnabled = (SETTINGS.studioTagSectionEnabled===false) ? true : false;
      saveData(); refreshAdminBody();
    } else if(action==="remove-profile-image"){
      const st = getStudio(el.dataset.id); if(st){ st.profileImage=null; saveData(); refreshAdminBody(); }
    } else if(action==="delete-sheet-post"){
      if(!confirm("이 게시물을 삭제할까요? 되돌릴 수 없어요.")) return;
      POSTS = POSTS.filter(function(p){ return p.id !== el.dataset.id; });
      saveData(); refreshAdminBody();
    } else if(action==="admin-login"){
      attemptAdminLogin();
    } else if(action==="admin-logout"){
      adminLogout();
    } else if(action==="save-settings"){
      const inp = document.getElementById("settings-studio-limit");
      let n = inp ? parseInt(inp.value,10) : NaN;
      if(!Number.isFinite(n) || n < 1) n = 1;
      if(n > 500) n = 500;
      SETTINGS.studioImageLimit = n;
      saveData();
      refreshAdminBody();
    } else if(action==="save-log-endpoint"){
      const inp = document.getElementById("settings-log-endpoint");
      SETTINGS.logEndpoint = inp ? inp.value.trim() : "";
      const la = document.getElementById("settings-log-admin");
      SETTINGS.logAdmin = la ? !!la.checked : true;
      saveData();
      refreshAdminBody();
    } else if(action==="test-sheet"){
      const out = document.getElementById("sheet-test-result");
      if(out) out.textContent = "확인하는 중…";
      testSheetConnection().then(function(msg){ const o = document.getElementById("sheet-test-result"); if(o) o.textContent = msg; });
    } else if(action==="send-catalog"){
      catalogStatus = "보내는 중…";
      const el0 = document.getElementById("catalog-status"); if(el0) el0.textContent = catalogStatus;
      sendCatalog(true).then(function(){ const el = document.getElementById("catalog-status"); if(el) el.textContent = catalogStatus; });
    } else if(action==="save-links"){
      const lg = document.getElementById("settings-link-logo"), mb = document.getElementById("settings-link-mbci");
      const lv = lg ? lg.value.trim() : "", mv = mb ? mb.value.trim() : "";
      const sve = document.getElementById("settings-link-service"), svv = sve ? sve.value.trim() : "";
      if((lv && !/^https?:\/\//i.test(lv)) || (mv && !/^https?:\/\//i.test(mv)) || (svv && !/^https?:\/\//i.test(svv))){ alert("링크는 http:// 또는 https:// 로 시작해야 해요."); return; }
      SETTINGS.links = {logo:lv, mbci:mv, service:svv};
      saveData();
      applyLinks();
      refreshAdminBody();
    } else if(action==="save-site-info"){
      const ti = document.getElementById("site-title"), de = document.getElementById("site-desc"), pu = document.getElementById("site-public-url");
      SETTINGS.siteTitle = ti ? ti.value.trim() : "";
      SETTINGS.siteDesc = de ? de.value.replace(/\s+/g," ").trim() : "";
      let pv = pu ? pu.value.trim() : "";
      if(pv && !/^https:\/\//i.test(pv)){ alert("공개 주소는 https:// 로 시작해야 해요. (예: https://계정.github.io/저장소/)"); return; }
      SETTINGS.publicUrl = pv;
      saveData();
      refreshAdminBody();
    } else if(action==="site-og-pick"){
      const fi = document.getElementById("site-og-file"); if(fi) fi.click();
    } else if(action==="site-og-reset"){
      delete SETTINGS.siteOgImage;
      saveData();
      refreshAdminBody();
    } else if(action==="save-hero-copy"){
      const ht = document.getElementById("settings-hero-title");
      const hs = document.getElementById("settings-hero-sub");
      SETTINGS.heroTitle = ht ? ht.value.replace(/\r/g,"").trim() : "";
      SETTINGS.heroSub = hs ? hs.value.replace(/\r/g,"").trim() : "";
      saveData();
      refreshAdminBody();
    } else if(action==="save-admin-password"){
      const cur = document.getElementById("settings-pw-current");
      const next = document.getElementById("settings-pw-new");
      const confirmEl = document.getElementById("settings-pw-confirm");
      const curVal = cur ? cur.value : "";
      const nextVal = next ? next.value : "";
      const confirmVal = confirmEl ? confirmEl.value : "";
      checkAdminPw(curVal).then(function(ok){
        if(!ok){ alert("현재 비밀번호가 올바르지 않아요."); return; }
        if(!nextVal || nextVal.length < 4){ alert("새 비밀번호는 4자 이상으로 입력해주세요."); return; }
        if(nextVal !== confirmVal){ alert("새 비밀번호 확인이 일치하지 않아요."); return; }
        setAdminPassword(nextVal).then(function(){
          saveData();
          alert("비밀번호가 변경됐어요.");
          refreshAdminBody();
        });
      });
    } else if(action==="new-post"){
      const studioId = el.dataset.studio;
      const count = postsByStudio(studioId).length;
      const limit = SETTINGS.studioImageLimit || 20;
      if(count >= limit){
        alert("한 스튜디오에는 게시물을 최대 "+limit+"개까지 등록할 수 있어요. 기존 게시물을 정리하거나 설정에서 제한을 늘려주세요.");
        return;
      }
      openAdminPostModal(null, studioId);
    } else if(action==="edit-post"){
      const p = getPost(el.dataset.id);
      if(p) openAdminPostModal(p.id, p.studioId);
    } else if(action==="modal-remove-image"){
      adminModalImages.splice(parseInt(el.dataset.idx,10),1);
      adminModalDirty = true;
      renderAdminPostModal();
    } else if(action==="save-post-modal"){
      if(adminModalSaving) return;
      if(pendingImageOps > 0){ alert("이미지를 처리하는 중이에요. 잠시 후 저장해주세요."); return; }
      const name = document.getElementById("admin-modal-name").value.trim();
      if(!name){ alert("프로젝트명을 입력해주세요."); return; }
      adminModalSaving = true;
      try{
        const desc = document.getElementById("admin-modal-desc").value.trim();
        const styleType = document.getElementById("admin-modal-style").value;
        const industryTags = Array.from(document.querySelectorAll("#admin-modal-industry input:checked")).map(i=>i.value);
        if(adminEditingPostId){
          const p = getPost(adminEditingPostId);
          p.name=name; p.description=desc; p.styleType=styleType; p.industryTags=industryTags; p.images=adminModalImages.slice();
        } else {
          POSTS.push({id:"p"+Date.now()+"-"+Math.random().toString(36).slice(2,7), studioId:adminEditingPostStudioId, name:name, description:desc, styleType:styleType, industryTags:industryTags, images:adminModalImages.slice(), createdAt:new Date().toISOString().slice(0,10)});
        }
        saveData();
        adminModalDirty = false;
      } finally {
        closeAdminModal();
      }
    } else if(action==="delete-post-modal"){
      if(adminModalSaving) return;
      adminModalSaving = true;
      try{
        if(adminEditingPostId){ POSTS = POSTS.filter(p=>p.id!==adminEditingPostId); saveData(); }
        adminModalDirty = false;
      } finally {
        closeAdminModal();
      }
    } else if(action==="reset-data"){
      if(confirm("샘플 데이터로 초기화할까요? 편집한 내용이 사라져요.")) resetData();
    } else if(action==="copy-json"){
      const ta = document.getElementById("export-json"); ta.select();
      try{ document.execCommand("copy"); alert("클립보드에 복사했어요."); }catch(e){ alert("복사에 실패했어요. 직접 선택해서 복사해주세요."); }
    } else if(action==="download-json"){
      const json = JSON.stringify({studios:STUDIOS, posts:POSTS}, null, 2);
      const blob = new Blob([json], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "prism-data.json"; a.click();
    } else if(action==="discard-draft"){
      if(confirm("이 브라우저에 남은 초안을 삭제하고, 파일에 담긴 원본 내용으로 되돌릴까요?")) discardDraft();
    } else if(action==="optimize-images"){
      if(confirm("새로 올린 이미지를 모두 WebP(1600px · 1MB 이하)로 변환할까요? 원본 화질로는 되돌릴 수 없어요.")) optimizeAllImages();
    } else if(action==="save-new-version"){
      exportNewVersionHTML();
    } else if(action==="export-web-zip"){
      exportWebUploadZip();
    }
  }

  /* =========================================================
     11. 라우터
     ========================================================= */
  function currentPath(){ return (location.hash||"").replace(/^#\/?/,""); }
  function updateActiveNav(path){
    const top = path.split("/")[0] || "";
    document.querySelectorAll("[data-route]").forEach(function(a){ a.classList.toggle("active", a.dataset.route===top); });
  }
  function updateAdminReturn(){
    let el = document.getElementById("admin-return");
    const show = isAdminAuthed() && currentPath().split("/").filter(Boolean)[0] !== "admin";
    if(!show){ if(el) el.classList.remove("show"); return; }
    if(!el){
      el = document.createElement("a"); el.id = "admin-return"; el.className = "admin-return"; el.href = "#/admin";
      el.innerHTML = '<span aria-hidden="true">←</span> 관리자 패널로 돌아가기';
      document.body.appendChild(el);
    }
    void el.offsetWidth; el.classList.add("show");
  }
  function render(){
    closeModal();
    closeFilterPanel();
    applyLinks();
    updateAdminReturn();
    hideLikeMilestoneToast();
    const path = currentPath();
    const parts = path.split("/").filter(Boolean);
    const app = document.getElementById("app");
    updateActiveNav(path);
    document.body.classList.toggle("on-liked", parts[0]==="liked");
    likedViewSnapshot = (parts[0]==="liked") ? getLikedIds().slice() : null;
    const isHome = !(parts[0]==="studio" || parts[0]==="liked" || parts[0]==="admin");
    if(parts[0]==="studio" && parts[1]) app.innerHTML = renderStudioPage(parts[1]);
    else if(parts[0]==="liked") app.innerHTML = renderLiked();
    else if(parts[0]==="admin") app.innerHTML = isAdminAuthed() ? renderAdmin() : renderAdminGate(false);
    else app.innerHTML = renderHome();
    if(parts[0]!=="admin") app.innerHTML += siteFooterHTML();
    if(isHome) setupHomeInfiniteScroll();
    updateLikeBadge();
    updateBusyUI();
    window.scrollTo(0,0);
    app.classList.remove("page-enter");
    void app.offsetWidth;
    app.classList.add("page-enter");
  }

  /* =========================================================
     12. 이벤트 위임
     ========================================================= */
  document.addEventListener("mousedown", function(e){
    adminOverlayMouseDownOnBackdrop = (e.target.id==="modal-overlay" || e.target.id==="admin-modal-overlay");
  });
  document.addEventListener("click", function(e){
    if(handleFilterClick(e)) return;
    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){ toggleLike(likeBtn.dataset.likeId); return; }

    const tagToggle = e.target.closest(".tag-toggle");
    if(tagToggle){ toggleTypeFilter(tagToggle.dataset.tag, tagToggle.dataset.type); return; }

    const gotoStyle = e.target.closest("[data-goto-style]");
    if(gotoStyle){ gotoTagFilter(gotoStyle.dataset.gotoStyle, "style"); return; }
    const gotoInd = e.target.closest("[data-goto-industry]");
    if(gotoInd){ gotoTagFilter(gotoInd.dataset.gotoIndustry, "industry"); return; }

    const clearTags = e.target.closest("[data-clear-tags]");
    if(clearTags){ selectedTypes.clear(); selectedIndustry.clear(); selectedStudio.clear(); mountHome(); return; }

    const opener = e.target.closest("[data-open-post]");
    if(opener){ handleTileTap(opener); return; }

    const goback = e.target.closest("[data-goback]");
    if(goback){ history.back(); return; }

    if(e.target.closest("[data-dismiss-hint]")){ dismissHint(); return; }
    if(e.target.closest("[data-dismiss-like-toast]")){ hideLikeMilestoneToast(); return; }

    const exportMainBtn = e.target.closest("#btn-export-analysis-image");
    if(exportMainBtn){ exportAnalysisImage("jpg"); return; }
    const resetLikesBtn = e.target.closest("#btn-reset-likes");
    if(resetLikesBtn){
      openConfirmDialog("모든 좋아요 정보가 초기화돼요. 진행할까요?", resetLikes, "초기화");
      return;
    }
    if(e.target.closest("[data-confirm-cancel]") || (e.target.id==="confirm-overlay")){ closeConfirmDialog(); return; }
    if(e.target.closest("[data-confirm-ok]")){
      const cb = pendingConfirmCallback;
      closeConfirmDialog();
      if(cb) cb();
      return;
    }

    if(e.target.closest("[data-modal-close]") || (e.target.id==="modal-overlay" && adminOverlayMouseDownOnBackdrop)){ closeModalAnimated(); return; }
    if(e.target.closest("[data-modal-prev]")){ shiftModalImage(-1); return; }
    if(e.target.closest("[data-modal-next]")){ shiftModalImage(1); return; }

    const adminTabBtn = e.target.closest("[data-admin-tab]");
    if(adminTabBtn){ cancelUntouchedNewStudio(); adminTab = adminTabBtn.dataset.adminTab; adminEditingStudioId=null; document.getElementById("app").innerHTML = renderAdmin(); return; }

    if(e.target.closest("[data-admin-modal-close]") || (e.target.id==="admin-modal-overlay" && adminOverlayMouseDownOnBackdrop)){ requestCloseAdminModal(); return; }

    const adminAction = e.target.closest("[data-admin-action]");
    if(adminAction){ handleAdminAction(adminAction); return; }
  });
  document.addEventListener("input", function(e){
    if(e.target.closest("#admin-modal-content")){ adminModalDirty = true; }
  });
  document.addEventListener("error", function(e){
    const el = e.target;
    if(el && el.tagName === "IMG" && el.hasAttribute("data-sheet-check-img")){
      const div = document.createElement("div");
      div.className = "sheet-thumb-broken";
      div.textContent = "링크 깨짐";
      if(el.parentNode) el.parentNode.replaceChild(div, el);
    }
  }, true);
  document.addEventListener("change", function(e){
    if(e.target.id==="admin-modal-file-input"){
      const files = Array.from(e.target.files||[]);
      if(!files.length) return;
      beginImageOp();
      readFilesRaw(files).then(function(raws){
        startCropQueue(raws, function(results){
          adminModalImages = adminModalImages.concat(results);
          adminModalDirty = true;
          renderAdminPostModal();
          endImageOp();
        });
      });
      return;
    }
    if(e.target.closest("#admin-modal-content")){ adminModalDirty = true; }
    const field = e.target.closest("[data-field]");
    if(field){ handleAdminFieldChange(field); }

    if(e.target.id==="sheet-upload-studio"){ sheetUploadStudio = e.target.value; return; }
    if(e.target.id==="sheet-bulk-file"){
      const files = Array.from(e.target.files||[]);
      if(files.length) bulkUploadToStudio(sheetUploadStudio, files);
      e.target.value = "";
      return;
    }
    const sheetField = e.target.closest("[data-sheet-field]");
    if(sheetField){
      const row = sheetField.closest("[data-sheet-row]");
      const p = row && getPost(row.dataset.sheetRow);
      if(!p) return;
      const field2 = sheetField.dataset.sheetField;
      if(field2==="industryTags"){
        p.industryTags = sheetField.value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      } else {
        p[field2] = sheetField.value;
      }
      saveData();
      return;
    }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      const pubOpen = document.getElementById("modal-overlay").classList.contains("open");
      const adminOpen = document.getElementById("admin-modal-overlay").classList.contains("open");
      if(pubOpen) closeModal();
      if(adminOpen) requestCloseAdminModal();
      return;
    }
    if((e.key==="Enter"||e.key===" ") && document.activeElement && document.activeElement.matches("[data-open-post]")){
      e.preventDefault();
      openPostModal(document.activeElement.dataset.openPost);
    }
    if(e.key==="Enter" && document.activeElement && document.activeElement.id==="admin-gate-pw"){
      e.preventDefault();
      attemptAdminLogin();
    }
  });

  window.addEventListener("hashchange", render);
  document.addEventListener("pointerdown", function(ev){
    const h = ev.target.closest(".crop-h");
    const box = ev.target.closest("#crop-box");
    if(!h && !box) return;
    ev.preventDefault();
    cropDrag = {
      mode: h ? h.dataset.h : "move",
      sx: ev.clientX, sy: ev.clientY,
      start: Object.assign({}, cropBoxRect)
    };
  });
  document.addEventListener("pointermove", function(ev){
    if(!cropDrag) return;
    const e = cropEls();
    const dw = e.img.clientWidth, dh = e.img.clientHeight;
    const dx = ev.clientX - cropDrag.sx, dy = ev.clientY - cropDrag.sy;
    const s = cropDrag.start;
    let r = Object.assign({}, s);
    if(cropDrag.mode === "move"){
      r.x = Math.min(Math.max(0, s.x + dx), dw - s.w);
      r.y = Math.min(Math.max(0, s.y + dy), dh - s.h);
    } else {
      let nw = s.w, nh = s.h, nx = s.x, ny = s.y;
      if(cropDrag.mode === "se"){ nw = s.w + dx; }
      if(cropDrag.mode === "ne"){ nw = s.w + dx; }
      if(cropDrag.mode === "sw"){ nw = s.w - dx; nx = s.x + dx; }
      if(cropDrag.mode === "nw"){ nw = s.w - dx; nx = s.x + dx; }
      nw = Math.max(24, nw);
      nh = cropRatio > 0 ? nw / cropRatio : Math.max(24, (cropDrag.mode === "nw" || cropDrag.mode === "ne") ? s.h - dy : s.h + dy);
      if(cropDrag.mode === "nw" || cropDrag.mode === "ne"){ ny = s.y + (s.h - nh); }
      if(nx < 0){ nx = 0; }
      if(ny < 0){ ny = 0; }
      if(nx + nw > dw){ nw = dw - nx; if(cropRatio > 0) nh = nw / cropRatio; }
      if(ny + nh > dh){ nh = dh - ny; if(cropRatio > 0) nw = nh * cropRatio; }
      r = {x:nx, y:ny, w:nw, h:nh};
    }
    cropBoxRect = r;
    drawCropBox();
  });
  document.addEventListener("pointerup", function(){ cropDrag = null; });
  document.addEventListener("click", function(ev){
    const rb = ev.target.closest(".crop-ratio");
    if(rb){
      document.querySelectorAll(".crop-ratio").forEach(function(b){ b.classList.remove("active"); });
      rb.classList.add("active");
      cropRatio = parseFloat(rb.dataset.ratio);
      resetCropBox();
      return;
    }
    if(ev.target.id === "crop-apply"){ applyCrop(false); return; }
    if(ev.target.id === "crop-skip"){ applyCrop(true); return; }
    if(ev.target.id === "crop-cancel"){
      cropQueue = [];
      document.getElementById("crop-overlay").classList.remove("open");
      const cb = cropDone; cropDone = null;
      const out = cropResults.slice(); cropResults = [];
      if(cb) cb(out);
      return;
    }
  });

  /* ---------- 최상단으로 가기 버튼 ---------- */
  const SCROLL_TOP_THRESHOLD = 480;
  let scrollTopTicking = false;
  function initScrollTopButton(){
    const btn = document.getElementById("scroll-top-btn");
    if(!btn) return;
    btn.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
    window.addEventListener("scroll", function(){
      if(scrollTopTicking) return;
      scrollTopTicking = true;
      requestAnimationFrame(function(){
        btn.classList.toggle("show", window.scrollY > SCROLL_TOP_THRESHOLD);
        scrollTopTicking = false;
      });
    }, {passive:true});
  }
  window.addEventListener("DOMContentLoaded", function(){
    if(!location.hash){ try{ history.replaceState(null,"","#/admin"); }catch(e){ location.hash="#/admin"; } }
    loadData();
    render();
    initScrollTopButton();
    // 초안은 IndexedDB에서 비동기로 읽어온다. 복원되면 화면을 다시 그린다.
    restoreDraft().then(function(applied){
      if(applied || draftState === "mismatch") render();
    });
  });
  // 탭을 닫거나 숨길 때 대기 중인 초안을 즉시 기록한다(디바운스로 유실되지 않게).
  window.addEventListener("pagehide", function(){ flushDraft(); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flushDraft();
  });
})();
</script>
